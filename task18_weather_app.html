<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 18 - Weather App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body{ background:#eaf2fb; font-family:'Segoe UI',Arial,sans-serif; }
  .phone-frame{ max-width:380px; margin:2rem auto; border:10px solid #1a1a1a; border-radius:36px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .weather-hero{ background:linear-gradient(160deg,#4a90d9,#1c5faf); color:#fff; padding:1.5rem 1.2rem 2rem; }
  .search-pill{ background:rgba(255,255,255,.2); border-radius:12px; }
  .search-pill input{ background:transparent; border:0; color:#fff; }
  .search-pill input::placeholder{ color:#d8e8fb; }
  .forecast-card{ background:#fff; border-radius:14px; margin-top:-30px; position:relative; z-index:2; }
  .hourly-item{ text-align:center; min-width:60px; }
  .day-row{ display:flex; justify-content:space-between; align-items:center; padding:.6rem 0; border-bottom:1px solid #f0f0f0; }
  .detail-tile{ background:#f4f8fd; border-radius:12px; padding:.8rem; text-align:center; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="weather-hero">
    <div class="search-pill d-flex align-items-center px-3 py-2 mb-4">
      <i class="bi bi-geo-alt-fill me-2"></i>
      <input class="form-control p-0" placeholder="Search city...">
      <i class="bi bi-search ms-2"></i>
    </div>
    <div class="text-center">
      <p class="mb-0">Salem, Tamil Nadu</p>
      <h1 class="display-3 fw-bold mb-0"><i class="bi bi-cloud-sun-fill"></i> 31°</h1>
      <p class="mb-0">Partly Cloudy</p>
      <p class="small mb-0">H: 34° &nbsp; L: 24°</p>
    </div>
  </div>

  <div class="forecast-card p-3 mx-3">
    <p class="fw-semibold small mb-2">Hourly Forecast</p>
    <div class="d-flex gap-3 overflow-auto pb-2">
      <div class="hourly-item"><p class="small mb-1">Now</p><i class="bi bi-sun-fill text-warning fs-5"></i><p class="small mb-0 fw-semibold">31°</p></div>
      <div class="hourly-item"><p class="small mb-1">1PM</p><i class="bi bi-cloud-sun-fill fs-5"></i><p class="small mb-0 fw-semibold">32°</p></div>
      <div class="hourly-item"><p class="small mb-1">2PM</p><i class="bi bi-cloud-fill fs-5"></i><p class="small mb-0 fw-semibold">30°</p></div>
      <div class="hourly-item"><p class="small mb-1">3PM</p><i class="bi bi-cloud-rain-fill text-primary fs-5"></i><p class="small mb-0 fw-semibold">27°</p></div>
      <div class="hourly-item"><p class="small mb-1">4PM</p><i class="bi bi-cloud-lightning-rain-fill text-secondary fs-5"></i><p class="small mb-0 fw-semibold">26°</p></div>
    </div>
  </div>

  <div class="p-3">
    <div class="row g-2 mb-3">
      <div class="col-4"><div class="detail-tile"><i class="bi bi-droplet-fill text-primary"></i><p class="small mb-0 mt-1">Humidity</p><p class="fw-semibold mb-0">68%</p></div></div>
      <div class="col-4"><div class="detail-tile"><i class="bi bi-wind text-info"></i><p class="small mb-0 mt-1">Wind</p><p class="fw-semibold mb-0">14 km/h</p></div></div>
      <div class="col-4"><div class="detail-tile"><i class="bi bi-eye-fill text-secondary"></i><p class="small mb-0 mt-1">Visibility</p><p class="fw-semibold mb-0">9 km</p></div></div>
    </div>

    <p class="fw-semibold small mb-2">7-Day Forecast</p>
    <div class="day-row"><span class="small">Monday</span><i class="bi bi-sun-fill text-warning"></i><span class="small">33° / 24°</span></div>
    <div class="day-row"><span class="small">Tuesday</span><i class="bi bi-cloud-sun-fill"></i><span class="small">31° / 23°</span></div>
    <div class="day-row"><span class="small">Wednesday</span><i class="bi bi-cloud-rain-fill text-primary"></i><span class="small">28° / 22°</span></div>
    <div class="day-row"><span class="small">Thursday</span><i class="bi bi-cloud-fill"></i><span class="small">29° / 23°</span></div>
    <div class="day-row"><span class="small">Friday</span><i class="bi bi-sun-fill text-warning"></i><span class="small">32° / 24°</span></div>
  </div>
</div>
</body>
</html>
